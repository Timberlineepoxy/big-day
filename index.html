<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Big Day</title>
<meta name="description" content="Count down to Christmas, Easter and every American holiday, plus birthdays and your own big days.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" id="favicon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Big Day">
<meta name="theme-color" content="#7a0b1f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap">
<style>
:root{
  --a:#d7263d; --b:#7a0b1f; --accent:#ffd34d;
  --card:#ffffff; --ink:#1d1b2e; --muted:#6b6880; --line:#ece8f4; --chip:#f3f0fa;
  --display:"Fredoka","Arial Rounded MT Bold","Segoe UI",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--card:#1f1d2e; --ink:#f4f2ff; --muted:#a9a5c4; --line:#302d45; --chip:#2a2740; color-scheme:dark}}
:root[data-theme="dark"]{--card:#1f1d2e; --ink:#f4f2ff; --muted:#a9a5c4; --line:#302d45; --chip:#2a2740; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:var(--body);font-size:16px;line-height:1.4;color:#fff;background:var(--b)}
body{min-height:100dvh;background:linear-gradient(170deg,var(--a) 0%,var(--b) 70%) fixed;transition:background .6s;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input{font:inherit;font-size:16px}
svg{display:block}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:calc(12px + var(--st)) 16px calc(28px + var(--sb))}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:-.01em;text-shadow:0 3px 0 rgba(0,0,0,.18)}
.logo .mk{width:34px;height:34px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
.bar .sp{flex:1}
.round{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);flex:none}
.round:active{transform:scale(.92)}
.round svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.round.on svg{fill:var(--accent);stroke:var(--accent)}

/* ---------- hero ---------- */
.hero{position:relative;display:block;width:100%;text-align:center;padding:18px 14px 20px;border-radius:30px;background:rgba(255,255,255,.14);
  border:2px solid rgba(255,255,255,.28);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);box-shadow:0 14px 40px rgba(0,0,0,.18)}
.hero:active{transform:scale(.985)}
.hero .tag{display:inline-block;font-weight:900;font-size:12px;letter-spacing:.14em;text-transform:uppercase;background:var(--accent);color:#2a1a00;padding:5px 12px;border-radius:99px}
.hero .art{width:118px;height:118px;margin:10px auto 2px;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 8px 0 rgba(0,0,0,.16))}
.hero .nm{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.1;text-shadow:0 3px 0 rgba(0,0,0,.18)}
.hero .big{font-family:var(--display);font-weight:700;font-size:118px;line-height:.95;margin-top:6px;letter-spacing:-.03em;text-shadow:0 6px 0 rgba(0,0,0,.2)}
.hero .unit{font-family:var(--display);font-weight:600;font-size:22px;margin-top:2px}
.hero .when{font-weight:700;opacity:.9;margin-top:4px}
.hero .yay{font-family:var(--display);font-weight:700;font-size:52px;line-height:1;margin:10px 0 4px;text-shadow:0 5px 0 rgba(0,0,0,.2);animation:pop 1.2s ease-in-out infinite alternate}
@keyframes bob{50%{transform:translateY(-10px) rotate(-3deg)}}
@keyframes pop{to{transform:scale(1.06)}}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg) scale(1.1)}75%{transform:rotate(12deg) scale(1.1)}}
.wiggle{animation:wig .5s ease-in-out!important}

.clock{display:flex;justify-content:center;gap:8px;margin-top:14px}
.clock .u{min-width:64px;background:rgba(0,0,0,.2);border-radius:16px;padding:8px 6px 6px}
.clock .n{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.clock .l{font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;opacity:.85;margin-top:3px}
.clock .n.tick{animation:tick .35s ease-out}
@keyframes tick{0%{transform:translateY(-6px) scale(1.15);opacity:.4}100%{transform:none;opacity:1}}

/* ---------- list ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;margin:18px -16px 12px;padding:2px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border-radius:99px;font-weight:900;font-size:15px;background:rgba(255,255,255,.2);color:#fff;border:2px solid transparent}
.chip.on{background:#fff;color:var(--b)}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--ink);border-radius:22px;padding:10px 14px 10px 10px;
  box-shadow:0 6px 0 rgba(0,0,0,.12);transition:transform .15s}
.row:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.12)}
.row .ic{width:58px;height:58px;border-radius:18px;flex:none;display:grid;place-items:center}
.row .ic svg{width:44px;height:44px}
.row .tx{flex:1;min-width:0}
.row .t{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .d{color:var(--muted);font-weight:700;font-size:14px}
.row .ct{text-align:center;flex:none;min-width:58px}
.row .ct b{display:block;font-family:var(--display);font-weight:700;font-size:28px;line-height:1;color:var(--ink)}
.row .ct span{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row .today{background:#ffd34d;color:#2a1a00;font-weight:900;font-size:13px;padding:6px 10px;border-radius:12px;letter-spacing:.04em}
.row .pin{width:18px;height:18px;fill:#ffc531;margin-right:-4px}
.month{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;opacity:.85;margin:10px 4px 0}
.make{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin:16px 0 4px;padding:18px;border-radius:24px;background:var(--accent);color:#2a1a00;
  font-family:var(--display);font-weight:700;font-size:21px;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.make:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.make svg{width:26px;height:26px;stroke:#2a1a00;stroke-width:3.4;fill:none;stroke-linecap:round}
.empty{background:rgba(255,255,255,.14);border-radius:22px;padding:22px;text-align:center;font-weight:700}

/* ---------- detail ---------- */
.detail{text-align:center;padding-top:4px}
.detail .tap{position:relative;display:block;width:100%;padding:6px 0 10px}
.detail .art{width:min(46vw,190px);height:min(46vw,190px);margin:0 auto;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 10px 0 rgba(0,0,0,.18))}
.detail h1{font-family:var(--display);font-weight:700;font-size:38px;line-height:1.05;margin:8px 0 2px;text-shadow:0 4px 0 rgba(0,0,0,.18)}
.detail .when{font-weight:800;font-size:17px;opacity:.92}
.flip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0 6px}
.flip .u{background:rgba(255,255,255,.95);color:#1d1b2e;border-radius:20px;padding:12px 4px 8px;box-shadow:0 6px 0 rgba(0,0,0,.18);position:relative;overflow:hidden}
.flip .u::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(0,0,0,.06)}
.flip .n{font-family:var(--display);font-weight:700;font-size:clamp(30px,10vw,52px);line-height:1;font-variant-numeric:tabular-nums}
.flip .n.tick{animation:flipin .4s ease-out}
@keyframes flipin{0%{transform:rotateX(80deg);opacity:.3}100%{transform:none;opacity:1}}
.flip .l{font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#6b6880;margin-top:4px}
.hint{font-weight:800;font-size:14px;opacity:.8;margin:8px 0 2px}
.greet{font-family:var(--display);font-weight:700;font-size:clamp(40px,13vw,64px);line-height:1.02;margin:16px 0 6px;text-shadow:0 5px 0 rgba(0,0,0,.2);animation:pop 1.1s ease-in-out infinite alternate}
.acts{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0 4px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:99px;background:rgba(255,255,255,.22);font-weight:900;font-size:15px}
.pill.gold{background:var(--accent);color:#2a1a00}
.pill svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pill.gold.on svg{fill:currentColor}
.pill:active{transform:scale(.95)}
.acts.music{margin-top:2px}
.pill#mus span{max-width:58vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill#mus.playing{background:#fff;color:#1d1b2e}
.pill#mus.playing svg{animation:pop .6s ease-in-out infinite alternate}
.by{font-size:13px;font-weight:800;opacity:.85;min-height:18px}
.sw small a{color:inherit}
.cards{display:flex;flex-direction:column;gap:12px;margin-top:16px;text-align:left}
.card{background:var(--card);color:var(--ink);border-radius:24px;padding:16px 18px;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.card h3{margin:0 0 6px;font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card p{margin:0;font-weight:700;font-size:17px}
.card.verse{background:linear-gradient(135deg,#fff8dd,#ffe9a8);color:#3d2a00}
.card.verse h3{color:#8a6100}
.card.verse p{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:20px;font-style:italic;line-height:1.35}
.card.verse cite{display:block;margin-top:8px;font-style:normal;font-weight:900;font-size:14px;color:#8a6100}
.fun{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fun div{background:var(--chip);border-radius:18px;padding:10px 12px}
.fun b{display:block;font-family:var(--display);font-weight:700;font-size:26px;line-height:1.05;font-variant-numeric:tabular-nums}
.fun span{font-size:13px;font-weight:800;color:var(--muted)}
.prog{height:22px;border-radius:99px;background:var(--chip);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--a),var(--accent));min-width:22px}
.small{font-size:13px;font-weight:700;color:var(--muted);margin-top:6px}

/* ---------- sheets ---------- */
.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(10,6,25,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{position:relative;overscroll-behavior:contain;width:100%;max-width:640px;max-height:92dvh;overflow-y:auto;background:var(--card);color:var(--ink);border-radius:28px 28px 0 0;padding:10px 18px calc(22px + var(--sb));animation:up .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(60%)}}
.grab{width:54px;height:6px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sheet-bg.closing{transition:opacity .22s;opacity:0}
.sheet .x{position:absolute;top:12px;right:14px;width:40px;height:40px;border-radius:50%;border:0;background:var(--chip);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.sheet .x svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round}
.sheet .x:active{transform:scale(.9)}
.sheet h2{font-family:var(--display);font-weight:700;font-size:26px;margin:4px 0 12px}
.sheet label.f{display:block;font-weight:900;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.sheet input[type=text],.sheet input[type=date],.sheet input[type=time],.sheet input[type=number]{width:100%;padding:13px 14px;border-radius:16px;border:2px solid var(--line);background:var(--chip);color:var(--ink);font-weight:800;font-size:17px;min-height:50px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.two input{min-width:0}
.tcats{display:flex;gap:6px;overflow-x:auto;margin:0 -18px 10px;padding:2px 18px;scrollbar-width:none}
.tcats::-webkit-scrollbar{display:none}
.tcats button{flex:none;padding:8px 14px;border-radius:99px;font-weight:900;font-size:14px;background:var(--chip);color:var(--ink)}
.tcats button.on{background:#8a3ff0;color:#fff}
.temps{display:grid;grid-template-rows:repeat(2,auto);grid-auto-flow:column;grid-auto-columns:84px;gap:8px;overflow-x:auto;margin:0 -18px;padding:2px 18px 4px;scrollbar-width:none}
.temps::-webkit-scrollbar{display:none}
.temp{display:flex;flex-direction:column;align-items:center;gap:4px;width:84px;padding:8px 4px;border-radius:18px;background:var(--chip);font-weight:800;font-size:12px;line-height:1.15;text-align:center}
.temp svg{width:40px;height:40px}
.icons{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.icons button{aspect-ratio:1;border-radius:14px;background:var(--chip);display:grid;place-items:center;border:3px solid transparent}
.icons button svg{width:78%;height:78%}
.icons button.on{border-color:#8a3ff0;background:#efe6ff}
.themes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.themes button{aspect-ratio:1;border-radius:50%;border:4px solid transparent;box-shadow:inset 0 0 0 2px rgba(255,255,255,.4)}
.themes button.on{border-color:var(--ink)}
.sw{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.sw .tx{flex:1;font-weight:800}
.sw .tx small{display:block;font-weight:700;color:var(--muted);font-size:13px}
.sw .ic{width:38px;height:38px;flex:none}
.tog{width:54px;height:32px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .2s}
.tog.on{background:#22c55e}
.tog.on::after{left:25px}
.seg{display:flex;background:var(--chip);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px;border-radius:12px;font-weight:900}
.seg button.on{background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.btn{display:block;width:100%;padding:16px;border-radius:20px;font-family:var(--display);font-weight:700;font-size:20px;margin-top:18px;background:#8a3ff0;color:#fff;box-shadow:0 5px 0 #5b21b6}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #5b21b6}
.btn.ghost{background:var(--chip);color:var(--ink);box-shadow:none;margin-top:10px;font-size:17px}
.btn.red{background:#fde2e4;color:#b4232f;box-shadow:none;margin-top:10px;font-size:17px}
.note{background:var(--chip);border-radius:16px;padding:12px 14px;font-weight:700;font-size:14px;color:var(--muted);margin-top:12px}
.grp{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 0 0}
/* ---------- today banner, surprise door, stickers ---------- */
.todaybn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:0 0 14px;padding:8px 14px 8px 8px;border-radius:22px;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.3)}
.todaybn:active{transform:scale(.98)}
.todaybn .ic,.row .ic.ph{background-size:cover;background-position:center}
.todaybn .ic{width:46px;height:46px;border-radius:15px;flex:none;display:grid;place-items:center}
.todaybn .ic svg{width:36px;height:36px}
.todaybn .tx{flex:1;min-width:0}
.todaybn small{display:block;font-weight:900;font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.todaybn b{display:block;font-family:var(--display);font-weight:600;font-size:19px;line-height:1.15}
.todaybn>svg{width:20px;height:20px;flex:none;transform:rotate(180deg);fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.doorc{display:flex;align-items:center;gap:16px;width:100%;text-align:left;margin-top:14px;padding:14px 16px;border-radius:26px;background:var(--card);color:var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.12)}
button.doorc:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.12)}
.door{width:74px;height:100px;flex:none;border-radius:38px 38px 8px 8px;background:#5b3a1e;padding:6px 6px 0;perspective:400px}
.dp{position:relative;width:100%;height:100%;border-radius:32px 32px 4px 4px;background:linear-gradient(160deg,#ff5d95,#8a3ff0);display:grid;place-items:center;
  transform-origin:left center;transition:transform .55s cubic-bezier(.5,0,.3,1);box-shadow:inset 0 0 0 3px rgba(255,255,255,.35);animation:knock 2.4s ease-in-out infinite}
.dp b{font-family:var(--display);font-weight:700;font-size:34px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.dp i{position:absolute;right:9px;top:54%;width:10px;height:10px;border-radius:50%;background:#ffd34d;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.door.opening{background:#fff3b0}
.door.opening .dp{transform:rotateY(-110deg);animation:none}
@keyframes knock{0%,80%,100%{transform:none}84%{transform:rotate(-3deg)}88%{transform:rotate(3deg)}92%{transform:rotate(-2deg)}}
.dtx{flex:1;min-width:0}
.dtx small{display:block;font-weight:900;font-size:14px;color:var(--muted)}
.dtx b{display:block;font-family:var(--display);font-weight:700;font-size:23px;line-height:1.1;margin:2px 0}
.dtx span{font-weight:800;color:#8a3ff0}
.doorc.open{display:block;animation:popin .45s cubic-bezier(.2,.9,.3,1.3)}
@keyframes popin{from{transform:scale(.85);opacity:0}}
.dbody h3{margin:0 0 6px;font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.dbody p{margin:0;font-weight:800;font-size:19px}
.dbody.verse p{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-style:italic;font-size:20px;line-height:1.35}
.dbody cite{display:block;margin-top:8px;font-style:normal;font-weight:900;font-size:14px;color:var(--muted)}
.dbody .ansT{margin-top:8px;color:#8a3ff0;font-family:var(--display);font-weight:700;font-size:22px;animation:popin .35s}
.mini{display:inline-block;margin-top:10px;padding:10px 16px;border-radius:14px;background:var(--chip);color:var(--ink);font-weight:900;font-size:15px}
.mini:active{transform:scale(.95)}
.dbody .mini{background:#8a3ff0;color:#fff}
.dbody .mini.done{background:#22c55e}
.stk{display:flex;align-items:center;gap:12px;margin-top:14px;padding-top:12px;border-top:2px dashed var(--line)}
.stk .sk{width:52px;height:52px;flex:none;border-radius:50%;background:#fff3b0;display:grid;place-items:center;box-shadow:0 0 0 3px #ffc531;animation:bob 3s ease-in-out infinite}
.stk .sk svg{width:38px;height:38px}
.stk .tx{flex:1;min-width:0}
.stk b{display:block;font-weight:900}
.stk span{font-weight:800;font-size:14px;color:var(--muted)}
.stk .mini{margin-top:0;flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stats div{background:var(--chip);border-radius:16px;padding:10px;text-align:center}
.stats b{display:block;font-family:var(--display);font-weight:700;font-size:28px;line-height:1}
.stats span{font-size:12px;font-weight:800;color:var(--muted)}
.book{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.book .st{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:16px;background:#fff8dd}
.book .st svg{width:48px;height:48px}
.book .st span{font-size:12px;font-weight:900;color:#8a6100}
/* ---------- photos, paper chain, share card ---------- */
.art.ph{position:relative;border-radius:30%;background-size:cover;background-position:center;border:5px solid #fff}
.art.ph .badge{position:absolute;right:-10%;bottom:-10%;width:42%;height:42%;filter:drop-shadow(0 3px 0 rgba(0,0,0,.2))}
.chain{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;width:100%;padding:6px 10px;row-gap:10px}
.chain i{display:block;width:36px;height:24px;border:6px solid var(--c);border-radius:13px;margin:0 -6px;transition:transform .5s ease-in,opacity .5s}
.chain i:nth-child(even){width:17px;position:relative;z-index:1}
.chain i.off{transform:translateY(60px) rotate(40deg);opacity:0}
.phrow{display:flex;align-items:center;gap:12px}
.phprev{width:72px;height:72px;flex:none;border-radius:20px;background:var(--chip) center/cover;display:grid;place-items:center}
.phprev svg{width:48px;height:48px}
.phbtns{display:flex;gap:8px;flex-wrap:wrap}
.phbtns .mini{margin-top:0}
.cardprev{min-height:120px;display:grid;place-items:center;background:var(--chip);border-radius:20px;overflow:hidden}
.cardprev img{display:block;width:100%;max-width:340px;margin:0 auto;border-radius:16px}
.btn:disabled{opacity:.5}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--sb));transform:translateX(-50%);z-index:30;background:#1d1b2e;color:#fff;padding:12px 18px;border-radius:16px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:up .25s}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<main id="app"></main>
<script src="holidays.js?v=10"></script>
<script src="art.js?v=10"></script>
<script src="music.js?v=10"></script>
<script src="surprises.js?v=10"></script>
<script src="app.js?v=10"></script>
<script>
// Check for a newer Big Day every time it is opened or brought back, and switch to it straight away.
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  const had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
  });
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && !reloaded) { reloaded = true; location.reload(); } });
}
</script>
</body>
</html>
